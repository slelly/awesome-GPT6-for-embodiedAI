 before using constrained robot tools in a closed loop.","detail":"Primary project material describes in-context adaptation and constrained tool execution; public experimental assets and licensing remain incomplete."},"P02":{"title":"GPT-as-Policy · GPT-6 Direct / π0.5 Hybrid","summary":"Compares direct GPT control with GPT-reviewed and corrected π0.5 actions on aligned RoboDojo cases.","detail":"Reported results apply to a selected aligned case set, not a same-seed rerun of official baselines."},"P03":{"title":"Agent as Policy (AGP)","summary":"A general agent observes, programs, commands, and corrects from execution feedback in a real bimanual setup.","detail":"The project publishes trial-data evidence, while public code availability and full real-robot configuration remain to be confirmed."},"P04":{"title":"RoboCurve · Bowl & Puzzle","summary":"Repeated YAM-arm trials contrast coarse pick-and-place with fine insertion and retain per-trial failure boundaries.","detail":"The official report distinguishes the two tasks; its results should not be read as one transferable robot score."},"P05":{"title":"StationeryBench · Five Real Bimanual Tasks","summary":"Markers, clips, rulers, sticky notes, and boxes form multi-stage bimanual tasks with both progress and completion reported.","detail":"Mean progress and fully completed trials are distinct reported measures and are shown separately."},"P06":{"title":"RoboDojo · Official GPT-6 Astra Evaluation Report","summary":"The September 21 paper reports Astra at 22.48% Average SR and 28.97 Score on 42 tasks × 50 episodes (2,100 trials). Unsafe actions halted the real-hardware protocol; the retained 33 trials are diagnostic material, not an official real-world result.","detail":"The report entry is retained, but its full quantitative body was not available in this snapshot."},"P07":{"title":"ENPIRE · GPT-6 Robot Autonomy Lead","summary":"NVIDIA's real-robot experimentation framework with a GPT-6-specific author demonstration lead.","detail":"The framework predates this window; the GPT-6 application is not treated as a confirmed framework-wide result."},"P08":{"title":"GPT6-real2sim · DROID / YAM Reconstruction","summary":"Reconstructs scenes, calibration, and contact replay from demonstrations while retaining unsuccessful physical replays.","detail":"Visual replay, fitted trajectories, and successful physical contact are kept as separate claims."},"P09":{"title":"Real2Sim_GPT6_ASTRA · Three-View Geometry Replay","summary":"Builds editable Blender scenes and action animation from three RGB views with public modelling and fitting code.","detail":"Editable animation is not evidence of validated physical control."},"P10":{"title":"Real2Gym","summary":"A workflow from human or robot video to executable robot simulation using Blender and MuJoCo.","detail":"The project page and code route are retained; individual implementation files were not audited here."},"P11":{"title":"dexgpt · Hand Video to Simulation","summary":"A located dexgpt repository with social-demo leads for 44-DoF hand tracking, IK, and grasping.","detail":"Implementation, licensing, and repeated experiment evidence remain unresolved."},"P12":{"title":"Drone-Bench · Astra Update","summary":"Evaluates models that write drone perception and control programs; the official page lists gpt-6-astra.","detail":"The benchmark is older and the precise date of the Astra update was not confirmed."},"P13":{"title":"Inspect Robots","summary":"An auditable evaluation framework shared by real and simulated tasks and multiple policy types.","detail":"It is execution infrastructure for RoboCurve reports, not a standalone GPT-6 result."},"P14":{"title":"Show-Harness","summary":"Routes discrete semantic actions through an embodiment interpreter with collection, training, models, and data.","detail":"It is a supporting resource; GPT-6-specific performance has not been established."},"P15":{"title":"PhysBrain 1.5 / PhysBrainEvalKit","summary":"An embodied-understanding evaluation with GPT-6 comparisons, an open model, and action/future-state demonstrations.","detail":"Understanding benchmarks are not equated with online control success."},"P16":{"title":"RoboDojo / XPolicyLab Infrastructure","summary":"Shared simulation and real-robot evaluation infrastructure: RoboDojo for environments and XPolicyLab for policy integration.","detail":"Infrastructure is retained as context rather than counted as a new GPT-6 experiment."},"P17":{"title":"HumanCLAW","summary":"A humanoid navigation and interaction benchmark with community Astra demonstration leads.","detail":"This entry confirms the benchmark itself, not a GPT-6-specific result."},"X01":{"title":"Physical Robot Keyboard Typing","summary":"An author demo shows physical key presses after roughly 40 minutes of exploration; video is accelerated.","detail":"This is an author-mirrored demonstration, not a standardized evaluation."},"X02":{"title":"Physical Ethernet Insertion","summary":"An author reports Ethernet insertion after roughly two hours and four human-prompt interventions.","detail":"The intervention count and duration are author-reported and need original-post verification."},"X03":{"title":"Robot Arm Draws the Golden Gate Bridge","summary":"A robot with a camera and pen attempts a semantic drawing goal over multiple trials.","detail":"The item is a demonstration lead rather than a comparative metric."},"X04":{"title":"Cross-Scene Mobile Manipulation ICL","summary":"An author shows mobile manipulation inferred from video across changed views and layouts.","detail":"The source is a social demonstration and does not establish broad generalization."},"X05":{"title":"G1 Coke-Bottle Grasp","summary":"An author shows Codex/Astra controlling G1 in Isaac Sim and explicitly notes IK use.","detail":"The simulation controller and the language model's role are recorded separately."},"X06":{"title":"G1 Navigation","summary":"An author shows GPT-6-generated navigation behavior and scenes in simulation.","detail":"This is a social demonstration lead, not a real-robot validation."},"X07":{"title":"Dexterous Hand Rubik's Cube","summary":"An author claims an Astra cube-solving demo; a personal page confirms a related MuJoCo bimanual project.","detail":"The original post and implementation details remain to be verified."},"X08":{"title":"Sharpa Dexterous-Hand Pen Spinning PPO","summary":"An author shows an Isaac Lab pen-spinning task built with Astra and trained with PPO.","detail":"The claim is author-provided; it is not treated as a repeated independent result."},"X09":{"title":"Go1 Paused-Physics Joint Control","summary":"An author describes pausing physics at each inference: 250 inferences for five seconds of simulated motion.","detail":"Simulation time and wall-clock inference time are intentionally not conflated."},"X10":{"title":"CARLA Visual Waypoint Driving","summary":"An author shows camera images mapped to short-horizon waypoints, then a local controller emits steering, throttle, and brake.","detail":"The language model does not receive sole credit for the controller's output."},"X11":{"title":"Two-Robot Ball Toss","summary":"An author shows a MuJoCo simulation of robots tossing and catching a ball.","detail":"This is a simulation demonstration lead without a standardized success record."},"X12":{"title":"G1 Bicycle-Control Code","summary":"An author says Astra helped write and debug MuJoCo bicycle-control code.","detail":"Code assistance is distinct from an online robot-control result."},"X13":{"title":"Dual-ALOHA Spatial-Constraint Demo","summary":"A lead for a dual-arm spatial-constraint demonstration.","detail":"The original demonstration and its protocol have not been verified in this snapshot."},"X14":{"title":"Office Scene to Newton / G1","summary":"A lead for constructing an office-scene simulation for Newton and G1.","detail":"This is a discovery lead, not confirmed physical execution."},"P18":{"title":"RoboHarm · Harmful-instruction Refusal Evaluation","summary":"Five fixed hazardous scenes compare whether GPT-6 Astra, Claude Fable 5.1, and MolmoAct2 attempt, refuse, or complete harmful robot instructions, with post-hoc review from three camera views and transcripts.","detail":"The public repository provides tasks and collection/labeling tools, but excludes raw rollouts and is not a frozen results dataset; report-only numbers are therefore not promoted here."},"P19":{"title":"RoboFind · Personalized Object Search for Blind and Low-Vision Users","summary":"A smartphone teaches a personal item, a Unitree Go2 searches, and verification/recovery agents decide whether to finish or continue; GPT-6 Astra builds the target profile and navigation instruction and is also evaluated as a separate baseline.","detail":"The sequential baseline is reconstructed from RoboFind trajectories, while the Astra-only comparison covers a separate 12-run shared-target subset."},"X15":{"title":"Wuji2 Hand Visual Self-Righting","summary":"An author demo shows GPT-6 Astra Ultra using third-person RGB feedback to make a fallen Wuji2 hand push itself upright with its fingers.","detail":"The supplied clip contains accelerated and normal-speed segments; prompts, tool interfaces, logs, and repeated-trial evidence are not public."},"P20":{"title":"EmbodiedSWE · Coding Agents for Long-Horizon Dexterous Robotics","summary":"GPT-6 Astra writes and iterates simulation solutions through Codex. The project covers 28 tasks and reports 82% success for Astra; the page does not state the main evaluation run denominator. Not independently reproduced."},"P21":{"title":"OpenArm Mona Lisa · LeRobot ACT","summary":"An OpenArm simulation painting entry in the HIM Astra challenge combines a scripted painting sequence with an ACT joint policy. GPT-6 assists development; physical hardware and real paint are untested. Publication date unknown."},"P22":{"title":"Fridge Speller · G1 Alphabet Magnets","summary":"A simulated Unitree G1 with Dex3-1 hands walks to a fridge and spells HELLO with magnets. The author credits GPT-6 Astra for building the project; this is a nominal-scene demo, without evidence of direct model control or real-hardware results. Publication date unknown."},"P23":{"title":"GPT-6-Astra Lights Up Embodied Navigation · Zero-Shot VLN-CE","summary":"Using only monocular RGB in a Codex harness, Astra chooses observations, primitive actions, and when to stop; single runs on R2R-CE-100 report 76.0%/79.0% SR for medium/ultra reasoning.","detail":"The fixed subset differs from full-split trained evaluations, each configuration has one run per episode, and route following and goal verification remain failure modes."},"P24":{"title":"Benchmarking Frontier VLMs on Robots · Pantograph","summary":"A common tool harness compares Astra and Fable across eight real-robot tasks on six Pandroid platforms.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P25":{"title":"Robot Agent Gallery","summary":"A public gallery collects scored Astra episodes across several simulated robot benchmarks without collapsing them into one score.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P26":{"title":"Axol Pick-and-Pack with Astra Reviews","summary":"Astra reviews camera images while deterministic guarded code plans and executes one documented physical pick-and-pack run.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P27":{"title":"LLM Robotics Playground · Five Simulation Experiments","summary":"Astra/Codex helped build the first four MuJoCo environments and controllers; a September 24 update adds a Baoding-balls Isaac Lab/PhysX PPO baseline, checkpoint, and fixed replay.","detail":"The Baoding addition is an RL baseline rather than online Astra control; replay does not call a model."},"P28":{"title":"GPT-6 Astra Policy on DexJoCo","summary":"Astra writes a controller once, then frozen code is evaluated over 900 simulated episodes.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P29":{"title":"Astra on RoboMME","summary":"Astra plans grounded subtasks, a VLA executes action chunks, and a small visual monitor decides when to re-plan.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P30":{"title":"RoboICL · Embodied In-Context Learning","summary":"Astra receives homologous TRAIN/LIVE visual-action-feedback context and produces bimanual end-effector deltas online.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P31":{"title":"GPT-6 LIBERO Manipulation Probe","summary":"A controlled probe separates planning, visual localization, and low-level control across four LIBERO pick-and-place tasks.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P32":{"title":"When the Map Becomes the Program · Astra World Model","summary":"Astra uses Blender tools to build object-level 3D scenes that are evaluated by downstream drone and G1 controllers.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P33":{"title":"Robot-vLLM","summary":"A GPT planner, an official OpenPI pi0.5 client, and ROS 2 execution/recovery are joined in a shared-perception simulation.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P34":{"title":"quackd · Multi-Robot LLM CLI","summary":"An LLM chooses among declared robot verbs through a CLI/harness; the retained experiment log documents an SO-101 wave run.","detail":"Author-provided evidence is retained with explicit protocol, licensing, and reproduction limits."},"P35":{"title":"RoboDawn · Closed-Loop Robot Control with Frozen VLMs","summary":"A frozen VLM issues discrete move, rotate, and gripper commands in a feedback loop and adapts from in-context demonstrations; GPT-6 Astra is evaluated in simulation, while the paper's real-robot table uses Gemini 3.8 Flash.","detail":"The catalogue keeps the simulation and real-robot model roles separate and reports author-provided results without claiming an independent reproduction."},"P36":{"title":"DrivingBench · Astra Closed-Loop Real-Car Evaluation","summary":"GPT-6 Astra used three MCP tools to observe and drive a real Toyota Corolla around a low-speed cone course, completing 134.7 m on its second attempt after same-chat reflection.","detail":"The result is one supervised continuous-chat trial on an empty lot, not evidence for public-road autonomous driving."},"P37":{"title":"Astra Robot Sim2Real · Elevator-Button Experience Reuse","summary":"GPT-6 Astra uses robot geometry, recorded experience, and reusable local skills to write low-level programs for elevator-button manipulation in simulation and on a physical XLeRobot.","detail":"Released timing reductions belong to distinct protocols and are not presented as a pooled general success rate."},"P38":{"title":"From Grasping to Skills · Cross-Session Astra Skill Reuse","summary":"Six fresh-session Astra/XLeRobot carton-grasping attempts retain only reviewed procedures and reusable code between sessions, preserving successes, failures, recoveries, and interventions.","detail":"The evolving one-run-per-version sequence is descriptive and does not establish a controlled causal improvement."},"P39":{"title":"BluPe Remote YAM · Shared Real-Robot Infrastructure","summary":"An open runner lets local Codex/Astra sessions join a shared YAM/SO101 queue, receive three camera views, and submit bounded trajectories through a supervised gateway.","detail":"This is execution infrastructure, not a standalone GPT-6 performance result; no robot was started during this catalogue review."},"P40":{"title":"Robo-Harness K1 · Perception Tools for Robot-Use Agents","summary":"K1 exposes calibrated depth, persistent anchors, spatial measurements, and grasp candidates as tools; GPT-6 Astra reaches 16/18 on a paired LIBERO-PRO subset versus 11/18 with an RGB-only interface.","detail":"The 18-case comparison changes several interface components together and reports Astra only in simulation."},"P41":{"title":"PyRUA-Lean · Robot Agents That Act in Code","summary":"GPT-6 Astra writes Python against a persistent robot object, combining perception, motion, VLA skills, and checks inside each call; the release compares this interface with RPent tool calling on four simulation suites.","detail":"The paired author results use the same model, primitives, cells, judges, and response budgets, but intentionally change the interaction form; no physical-robot result is claimed."},"P42":{"title":"GPT-6 Astra Real2Sim Workflow · Editable Rooms and Simulation Review","summary":"Astra observes room photos, makes modelling decisions, and reviews previews while Blender and Python produce editable scenes, geometry audits, and an optional MuJoCo replay.","detail":"Furniture specifications and reference assets assist reconstruction, so the published object-level surface scores are not an independent held-out room benchmark."}}},"media":{"P01":{"kind":"video","url":"https://raw.githubusercontent.com/cheng-haha/GPT-Policy/main/assets/videos/gpt6-sprite-retrieval-5s.mp4","poster":"assets/posters/P01.jpg","source_url":"https://github.com/cheng-haha/GPT-Policy","source_path":"Repository MP4 URL; first decoded frame at 00:00:00, extracted 2026-09-19 with ffmpeg.","classification":"Static poster extracted from the project-hosted video; not a separate result image.","source_id":"S001","alt":{"en":"GPT-Policy repository demonstration video for the GPT-6 Sprite retrieval task.","zh":"GPT-Policy 仓库中的 GPT-6 Sprite 检索任务演示视频。"},"caption":{"en":"Repository-provided 5-second Sprite retrieval demonstration; se <script>
'use strict';
const DATA=JSON.parse(document.getElementById('catalog-data').textContent),$=id=>document.getElementById(id),projects=DATA.projects,store='gpt6-embodied-language';
const UI={en:{eyebrow:'Project gallery',headline:'Awesome GPT6 <span>Embodied AI</span>',subhead:'Explore embodied-AI projects, demos, key results, and links.',missing:'Preview unavailable',footer:'Media and links are hosted by their respective project sites.',projects:'Projects',social:'Social',search:'Search projects or tags',searchPlaceholder:'e.g. RoboDojo, sim real',clear:'Clear',noMatches:'No matching entries in this tab.',published:'Published'},zh:{eyebrow:'项目画廊',headline:'Awesome GPT6 <span>具身智能</span>',subhead:'浏览具身智能项目、演示、关键结果与链接。',missing:'暂无预览',footer:'媒体与链接由相应项目网站托管。',projects:'项目',social:'社媒',search:'搜索项目或标签',searchPlaceholder:'例如：RoboDojo、sim real',clear:'清除',noMatches:'当前页签没有匹配条目。',published:'发布日期'}};
function browserLang(){for(const raw of (navigator.languages||[navigator.language||'en'])){const candidate=String(raw).toLowerCase().split('-')[0];if(candidate==='en'||candidate==='zh')return candidate}return'en'}let lang=(()=>{try{return localStorage.getItem(store)||browserLang()}catch{return browserLang()}})();if(!UI[lang])lang='en';let group='projects',query='';
function t(p){return lang==='en'?DATA.i18n.en[p.id]:{title:p.title,summary:p.summary}}function text(key){return UI[lang][key]}
function imageBox(item){const box=document.createElement('div');box.className='media';const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent=text('missing');if(item.kind==='image'){const img=document.createElement('img');img.src=item.url;img.alt=item.alt[lang];img.loading='lazy';img.referrerPolicy='no-referrer';if(item.fit==='contain'){img.style.objectFit='contain';img.style.background='#fff'}img.addEventListener('error',()=>box.classList.add('failed'));box.append(img)}else if(item.kind==='video'){const video=document.createElement('video');video.src=item.url;video.controls=true;video.preload='none';video.playsInline=true;video.poster=item.poster||'';video.addEventListener('error',()=>box.classList.add('failed'));box.append(video)}else box.classList.add('missing');box.append(fallback);return box}
function linkKind(key,url){try{const host=new URL(url).hostname.toLowerCase();if(host==='github.com')return'code';if(host==='arxiv.org')return'paper';if(host==='x.com'||host==='www.x.com'||host==='huggingface.co'||host==='raw.githubusercontent.com'||host==='assets.andonlabs.com'||host==='media.luminis-sim.com')return null}catch{return null}if(key==='paper')return'paper';if(key==='code')return'code';if(key==='project'||key==='main')return'project';return null}
function linkLabel(key){const en={project:'Project page',paper:'Paper',code:'Code',post:'Post'};const zh={project:'项目主页',paper:'论文',code:'代码',post:'原帖'};return(lang==='en'?en:zh)[key]}
function projectLinks(p){const candidates=[['main',p.url],['code',p.code_url],...Object.entries(p.links)];const first={};for(const [key,url] of candidates){if(!url)continue;const kind=linkKind(key,url);if(kind&&!first[kind])first[kind]=url}return['paper','code','project'].filter(kind=>first[kind]).map(kind=>[kind,first[kind]])}
function xKind(url){try{const u=new URL(url),host=u.hostname.toLowerCase(),parts=u.pathname.split('/').filter(Boolean);if((host==='x.com'||host==='www.x.com')&&parts.includes('status'))return'post'}catch{}return null}
function displayLinks(p){const social=[p.url,p.links.x,p.links.post].find(url=>xKind(url)==='post');return social?[...projectLinks(p),['post',social]]:projectLinks(p)}
function groupFor(p){if(['X07','X15'].includes(p.id))return'social';if(p.section!=='watchlist')return'projects';const candidates=[p.url,p.code_url,...Object.values(p.links||{})];return candidates.some(url=>{try{const host=new URL(url).hostname.toLowerCase();return host!=='x.com'&&host!=='www.x.com'}catch{return false}})?'projects':'social'}
function projectTags(p){return[...p.scene_tags,...DATA.topic_tags[p.id]]}function tagLabel(tag,language=lang){return DATA.tag_labels[tag][language]}
function queryTerms(){return query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}function matchesQuery(p){const names=[p.title,DATA.i18n.en[p.id].title].join(' ').toLocaleLowerCase(),tags=projectTags(p),tagIndex=tags.flatMap(tag=>[tag,...Object.values(DATA.tag_labels[tag])]).join(' ').toLocaleLowerCase();return queryTerms().every(term=>['sim','real'].includes(term)?p.scene_tags.includes(term):names.includes(term)||tagIndex.includes(term))}
function publicationDate(p){const entry=DATA.publication_dates[p.id],display=entry.date.replace(/-(\d{2})$/,'$1');return{value:display,status:entry.status}}
function card(p){const local=t(p),item=DATA.media[p.id],article=document.createElement('article');article.className='card';article.append(imageBox(item));const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=local.title;const published=document.createElement('p');published.className='published';const label=document.createElement('span');label.className='label';label.textContent=text('published');const date=publicationDate(p);const value=document.createElement('span');value.textContent=date.value;published.dataset.dateState=date.status;published.append(label,value);const summary=document.createElement('p');summary.className='summary';summary.textContent=local.summary;const tags=document.createElement('div');tags.className='tags';projectTags(p).forEach(tag=>{const el=document.createElement('span');el.className='tag scene-tag';el.dataset.tag=tag;el.textContent=tagLabel(tag);tags.append(el)});const actions=document.createElement('div');actions.className='actions';displayLinks(p).forEach(([key,url])=>{const entry=document.createElement('a');entry.href=url;entry.target='_blank';entry.rel='noopener noreferrer';entry.textContent=linkLabel(key);actions.append(entry)});body.append(h,published,summary,tags,actions);article.append(body);return article}
function render(){const visible=projects.filter(p=>groupFor(p)===group&&matchesQuery(p)).sort((a,b)=>DATA.publication_dates[b.id].date.localeCompare(DATA.publication_dates[a.id].date));const cards=visible.map(p=>{const el=card(p);el.dataset.projectId=p.id;return el});if(!cards.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=text('noMatches');cards.push(empty)}$('gallery').replaceChildren(...cards);$('query').value=query;$('query').placeholder=text('searchPlaceholder');$('search-label').textContent=text('search');$('clear-query').textContent=text('clear');$('clear-query').disabled=!query;document.querySelectorAll('[data-group]').forEach(button=>{button.textContent=text(button.dataset.group);button.setAttribute('aria-pressed',String(button.dataset.group===group))})}
function applyLanguage(next,manual=false){lang=next;if(manual)try{localStorage.setItem(store,next)}catch{}document.documentElement.lang=lang;$('eyebrow').textContent=text('eyebrow');$('headline').innerHTML=text('headline');$('footer').textContent=text('footer');document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));render()}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>applyLanguage(button.dataset.lang,true)));document.querySelectorAll('[data-group]').forEach(button=>button.addEventListener('click',()=>{group=button.dataset.group;render()}));$('query').addEventListener('input',event=>{query=event.target.value;render()});$('clear-query').addEventListener('click',()=>{query='';render();$('query').focus()});applyLanguage(lang);
</script>
