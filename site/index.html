<script>
'use strict';
const DATA=JSON.parse(document.getElementById('catalog-data').textContent),$=id=>document.getElementById(id),projects=DATA.projects,store='gpt6-embodied-language';
const UI={en:{eyebrow:'Project gallery',headline:'Awesome GPT6<br><span>Embodied AI</span>',subhead:'Explore embodied-AI projects, demos, key results, and links.',missing:'Preview unavailable',footer:'Media and links are hosted by their respective project sites.',projects:'Projects',social:'Social',search:'Search projects or tags',searchPlaceholder:'e.g. RoboDojo, sim real',clear:'Clear',noMatches:'No matching entries in this tab.',published:'Published'},zh:{eyebrow:'项目画廊',headline:'Awesome GPT6<br><span>具身智能</span>',subhead:'浏览具身智能项目、演示、关键结果与链接。',missing:'暂无预览',footer:'媒体与链接由相应项目网站托管。',projects:'项目',social:'社媒',search:'搜索项目或标签',searchPlaceholder:'例如：RoboDojo、sim real',clear:'清除',noMatches:'当前页签没有匹配条目。',published:'发布日期'}};
function browserLang(){for(const raw of (navigator.languages||[navigator.language||'en'])){const candidate=String(raw).toLowerCase().split('-')[0];if(candidate==='en'||candidate==='zh')return candidate}return'en'}let lang=(()=>{try{return localStorage.getItem(store)||browserLang()}catch{return browserLang()}})();if(!UI[lang])lang='en';let group='projects',query='';
function t(p){return lang==='en'?DATA.i18n.en[p.id]:{title:p.title,summary:p.summary}}function text(key){return UI[lang][key]}
function imageBox(item){const box=document.createElement('div');box.className='media';const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent=text('missing');if(item.kind==='image'){const img=document.createElement('img');img.src=item.url;img.alt=item.alt[lang];img.loading='lazy';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>box.classList.add('failed'));box.append(img)}else if(item.kind==='video'){const video=document.createElement('video');video.src=item.url;video.controls=true;video.preload='none';video.playsInline=true;video.poster=item.poster||'';video.addEventListener('error',()=>box.classList.add('failed'));box.append(video)}else box.classList.add('missing');box.append(fallback);return box}
function linkKind(key,url){try{const host=new URL(url).hostname.toLowerCase();if(host==='github.com')return'code';if(host==='arxiv.org')return'paper';if(host==='x.com'||host==='www.x.com'||host==='huggingface.co'||host==='raw.githubusercontent.com'||host==='assets.andonlabs.com'||host==='media.luminis-sim.com')return null}catch{return null}if(key==='paper')return'paper';if(key==='code')return'code';if(key==='project'||key==='main')return'project';return null}
function linkLabel(key){const en={project:'Project page',paper:'Paper',code:'Code',post:'Post'};const zh={project:'项目主页',paper:'论文',code:'代码',post:'原帖'};return(lang==='en'?en:zh)[key]}
function projectLinks(p){const candidates=[['main',p.url],['code',p.code_url],...Object.entries(p.links)];const first={};for(const [key,url] of candidates){if(!url)continue;const kind=linkKind(key,url);if(kind&&!first[kind])first[kind]=url}return['paper','code','project'].filter(kind=>first[kind]).map(kind=>[kind,first[kind]])}
function xKind(url){try{const u=new URL(url),host=u.hostname.toLowerCase(),parts=u.pathname.split('/').filter(Boolean);if((host==='x.com'||host==='www.x.com')&&parts.includes('status'))return'post'}catch{}return null}
function displayLinks(p){const social=[p.url,p.links.x,p.links.post].find(url=>xKind(url)==='post');return social?[...projectLinks(p),['post',social]]:projectLinks(p)}
function groupFor(p){if(p.id==='X07')return'social';if(p.section!=='watchlist')return'projects';const candidates=[p.url,p.code_url,...Object.values(p.links||{})];return candidates.some(url=>{try{const host=new URL(url).hostname.toLowerCase();return host!=='x.com'&&host!=='www.x.com'}catch{return false}})?'projects':'social'}
function queryTerms(){return query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}function matchesQuery(p){const names=[p.title,DATA.i18n.en[p.id].title].join(' ').toLocaleLowerCase();return queryTerms().every(term=>['sim','real'].includes(term)?p.scene_tags.includes(term):names.includes(term))}
function publicationDate(p){const entry=DATA.publication_dates[p.id],display=entry.date.replace(/-(\d{2})$/,'$1');return{value:display,status:entry.status}}
function card(p){const local=t(p),item=DATA.media[p.id],article=document.createElement('article');article.className='card';article.append(imageBox(item));const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=local.title;const published=document.createElement('p');published.className='published';const label=document.createElement('span');label.className='label';label.textContent=text('published');const date=publicationDate(p);const value=document.createElement('span');value.textContent=date.value;published.dataset.dateState=date.status;published.append(label,value);const summary=document.createElement('p');summary.className='summary';summary.textContent=local.summary;const tags=document.createElement('div');tags.className='tags';p.scene_tags.forEach(tag=>{const el=document.createElement('span');el.className='tag scene-tag';el.textContent=tag;tags.append(el)});const actions=document.createElement('div');actions.className='actions';displayLinks(p).forEach(([key,url])=>{const entry=document.createElement('a');entry.href=url;entry.target='_blank';entry.rel='noopener noreferrer';entry.textContent=linkLabel(key);actions.append(entry)});body.append(h,published,summary,tags,actions);article.append(body);return article}
function render(){const visible=projects.filter(p=>groupFor(p)===group&&matchesQuery(p));const cards=visible.map(p=>{const el=card(p);el.dataset.projectId=p.id;return el});if(!cards.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=text('noMatches');cards.push(empty)}$('gallery').replaceChildren(...cards);$('query').value=query;$('query').placeholder=text('searchPlaceholder');$('search-label').textContent=text('search');$('clear-query').textContent=text('clear');$('clear-query').disabled=!query;document.querySelectorAll('[data-group]').forEach(button=>{button.textContent=text(button.dataset.group);button.setAttribute('aria-pressed',String(button.dataset.group===group))})}
function applyLanguage(next,manual=false){lang=next;if(manual)try{localStorage.setItem(store,next)}catch{}document.documentElement.lang=lang;$('eyebrow').textContent=text('eyebrow');$('headline').innerHTML=text('headline');$('subhead').textContent=text('subhead');$('footer').textContent=text('footer');document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)));render()}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>applyLanguage(button.dataset.lang,true)));document.querySelectorAll('[data-group]').forEach(button=>button.addEventListener('click',()=>{group=button.dataset.group;render()}));$('query').addEventListener('input',event=>{query=event.target.value;render()});$('clear-query').addEventListener('click',()=>{query='';render();$('query').focus()});applyLanguage(lang);
</script>
